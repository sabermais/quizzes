<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — A Segunda Guerra Mundial | Saber Mais+</title>
<style>
  :root{
    --bg:#060610; --card:#0E0E1F; --card2:#15152B;
    --accent:#3B82F6; --accent2:#7C5CFF;
    --ok:#00A86B; --err:#E53935;
    --txt:#EAEAF5; --muted:#9A9AB5; --border:#262642;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:var(--sans); background:
      radial-gradient(900px 500px at 110% -5%, rgba(124,92,255,.18), transparent 60%),
      radial-gradient(800px 500px at -10% 0%, rgba(59,130,246,.16), transparent 55%), var(--bg);
    color:var(--txt); min-height:100vh; line-height:1.55; -webkit-font-smoothing:antialiased; padding:0 0 60px;}
  .wrap{max-width:720px; margin:0 auto; padding:20px 18px;}
  .progress-shell{position:sticky; top:0; z-index:20; background:rgba(6,6,16,.85); backdrop-filter:blur(8px); padding:12px 0 10px;}
  .progress-track{height:10px; background:#1B1B33; border-radius:999px; overflow:hidden; box-shadow:inset 0 0 0 1px var(--border);}
  .progress-fill{height:100%; width:0%; border-radius:999px; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .4s cubic-bezier(.4,0,.2,1); box-shadow:0 0 12px rgba(124,92,255,.7);}
  .meta{display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-size:.9rem; color:var(--muted); font-weight:700;}
  .streak{display:flex; align-items:center; gap:6px; opacity:0; transform:scale(.6); transition:.3s; color:#FF8A3D;}
  .streak.show{opacity:1; transform:scale(1);}
  .streak.pop{animation:pop .4s;}
  @keyframes pop{0%{transform:scale(1);}50%{transform:scale(1.35);}100%{transform:scale(1);}}
  .head{text-align:center; padding:26px 10px 10px;}
  .head .tag{display:inline-block; font-size:.74rem; letter-spacing:.16em; text-transform:uppercase; font-weight:800; color:#fff; background:linear-gradient(90deg,var(--accent),var(--accent2)); padding:5px 14px; border-radius:999px; margin-bottom:14px;}
  .head h1{font-size:1.7rem; font-weight:900; letter-spacing:-.5px; line-height:1.15;}
  .head p{color:var(--muted); margin-top:8px; font-weight:600;}
  .card{background:linear-gradient(180deg,var(--card),var(--card2)); border:1px solid var(--border); border-radius:20px; padding:24px 22px; margin-top:18px; box-shadow:0 20px 50px -24px rgba(0,0,0,.8);}
  .qnum{font-size:.82rem; font-weight:800; color:var(--accent); letter-spacing:.04em; text-transform:uppercase;}
  .lvl{display:inline-block; background:rgba(229,57,53,.18); color:#FF6B68; border:1px solid rgba(229,57,53,.5); font-size:.64rem; padding:2px 9px; border-radius:999px; margin-left:7px; letter-spacing:.08em; vertical-align:middle;}
  .qtext{font-size:1.18rem; font-weight:800; margin:8px 0 18px; line-height:1.4;}
  .opt{display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left; cursor:pointer; background:#10101F; border:1.5px solid var(--border); color:var(--txt); border-radius:14px; padding:14px 16px; margin:10px 0; font-size:1rem; font-weight:600; font-family:inherit; transition:.18s;}
  .opt:hover:not(:disabled){border-color:var(--accent); box-shadow:0 0 0 3px rgba(59,130,246,.15); transform:translateY(-1px);}
  .opt .letter{flex:none; width:28px; height:28px; border-radius:8px; background:#1E1E3A; color:var(--accent); display:grid; place-items:center; font-weight:900; font-size:.9rem; transition:.18s;}
  .opt .mark{margin-left:auto; font-size:1.1rem; opacity:0;}
  .opt.correct{background:rgba(0,168,107,.16); border-color:var(--ok);}
  .opt.correct .letter{background:var(--ok); color:#fff;} .opt.correct .mark{opacity:1;}
  .opt.wrong{background:rgba(229,57,53,.14); border-color:var(--err);}
  .opt.wrong .letter{background:var(--err); color:#fff;} .opt.wrong .mark{opacity:1;}
  .opt:disabled{cursor:default;}
  .fb{margin-top:16px; border-radius:14px; padding:16px 18px; font-size:.98rem; display:none; border-left:5px solid;}
  .fb.show{display:block; animation:fade .35s;}
  .fb.ok{background:rgba(0,168,107,.10); border-color:var(--ok);}
  .fb.no{background:rgba(229,57,53,.10); border-color:var(--err);}
  .fb .fbtitle{font-weight:900; margin-bottom:5px; display:flex; align-items:center; gap:7px;}
  .fb.ok .fbtitle{color:#3DDC97;} .fb.no .fbtitle{color:#FF6B68;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);}to{opacity:1; transform:none;}}
  .next{margin-top:18px; width:100%; padding:15px; border:0; border-radius:14px; cursor:pointer; font-family:inherit; font-size:1.05rem; font-weight:800; color:#fff; background:linear-gradient(90deg,var(--accent),var(--accent2)); box-shadow:0 10px 26px -10px rgba(124,92,255,.7); display:none; transition:.18s;}
  .next:hover{transform:translateY(-2px);} .next.show{display:block;}
  .final{text-align:center; padding:36px 22px;}
  .final .medal{font-size:5rem; animation:pop .6s;}
  .final h2{font-size:1.8rem; font-weight:900; margin:6px 0;}
  .final .score{font-size:1.1rem; color:var(--muted); font-weight:700;}
  .final .pct{font-size:3.2rem; font-weight:900; background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; margin:10px 0;}
  .final .stats{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin:18px 0 26px;}
  .final .stat{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 20px; min-width:120px;}
  .final .stat .big{font-size:1.6rem; font-weight:900;} .final .stat .lbl{font-size:.78rem; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.05em;}
  .restart{padding:14px 28px; border:0; border-radius:14px; cursor:pointer; font-family:inherit; font-size:1.05rem; font-weight:800; color:#fff; background:linear-gradient(90deg,var(--accent),var(--accent2)); box-shadow:0 10px 26px -10px rgba(124,92,255,.7);}
  .restart:hover{transform:translateY(-2px);}
  .confetti{position:fixed; top:-12px; width:10px; height:14px; z-index:50; pointer-events:none; border-radius:2px;}
  .hidden{display:none;}
  @media(max-width:480px){ .head h1{font-size:1.4rem;} .qtext{font-size:1.08rem;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="progress-shell">
    <div class="progress-track"><div class="progress-fill" id="pfill"></div></div>
    <div class="meta">
      <span id="counter"></span>
      <span class="streak" id="streak">🔥 <span id="streakn">0</span> seguidas</span>
    </div>
  </div>
  <div id="quiz">
    <div class="head">
      <span class="tag">HISTÓRIA • 9º ANO</span>
      <h1>🌍 Quiz: A Segunda Guerra Mundial</h1>
      <p id="intro"></p>
    </div>
    <div id="cardArea"></div>
  </div>
  <div id="finalScreen" class="final hidden"></div>
</div>

<script>
const QUESTIONS = [
 {q:"O que era o conceito nazista de \"Espaço Vital\" (Lebensraum)?",
  o:["A ideia de que a Alemanha, como \"raça superior\", precisava de mais território para sua expansão demográfica e econômica","A união de todos os países de língua alemã em uma federação","A criação de territórios coloniais alemães na África","Uma zona neutra desmilitarizada entre Alemanha e França","Um acordo de livre comércio entre países europeus"],c:0,
  fb:"O \"Espaço Vital\" era a justificativa ideológica nazista para o expansionismo: a crença de que a Alemanha precisava conquistar mais território no Leste Europeu para crescer. As demais opções descrevem outros tipos de arranjo territorial ou econômico, não essa ideologia específica."},

 {q:"Por que Inglaterra, França e Estados Unidos inicialmente fizeram \"vista grossa\" ao avanço do fascismo na Europa?",lvl:"AVANÇADA",
  o:["Porque temiam mais o avanço do comunismo do que o próprio fascismo","Porque acreditavam que o fascismo traria estabilidade econômica ao continente","Porque consideravam a Alemanha uma aliada contra o Japão","Porque desconheciam totalmente o rearmamento alemão","Porque estavam mais preocupados com conflitos na Ásia"],c:0,
  fb:"O medo do comunismo soviético era, para essas potências, uma ameaça maior do que o fascismo em ascensão — por isso toleraram avanços que deveriam ter sido barrados. As outras alternativas não refletem o motivo histórico apresentado no capítulo."},

 {q:"O que a Alemanha fez entre 1933 e 1939 que desrespeitava diretamente o Tratado de Versalhes?",
  o:["Reaparelhou suas Forças Armadas, ampliando o exército de 100 mil para 800 mil soldados e tornando o serviço militar obrigatório","Reduziu ainda mais o tamanho do seu exército","Assinou um novo tratado de paz permanente com a Inglaterra","Aboliu completamente o serviço militar obrigatório","Anexou pacificamente o território francês"],c:0,
  fb:"O Tratado de Versalhes limitava drasticamente as forças armadas alemãs; o reaparelhamento militar entre 1933 e 1939 foi uma violação direta desse tratado. As demais alternativas descrevem o oposto do que ocorreu."},

 {q:"O que foi o Eixo Roma-Berlim-Tóquio, formado em 1936?",lvl:"AVANÇADA",
  o:["Uma aliança entre Alemanha, Itália e Japão","Uma aliança entre Alemanha, URSS e Japão","Um pacto comercial entre Alemanha, Itália e Espanha","Uma aliança militar entre países escandinavos","Um tratado de não agressão entre França e Alemanha"],c:0,
  fb:"O Eixo reunia as três potências que se tornariam o bloco oposto aos Aliados na Segunda Guerra: Alemanha, Itália e Japão. Nenhuma das outras combinações de países corresponde a essa aliança."},

 {q:"O que foi o Anschluss, ocorrido em 1938?",
  o:["A anexação da Áustria à Alemanha, aprovada por 99% dos votantes em um plebiscito","A anexação da Tchecoslováquia pela Alemanha","A invasão alemã da Polônia","A criação da República de Vichy no sul da França","Um acordo de paz definitivo entre Alemanha e França"],c:0,
  fb:"Anschluss é o nome dado à anexação da Áustria pela Alemanha em 1938, aprovada em um plebiscito com resultado esmagador. A anexação da Tchecoslováquia (Sudetos) foi um evento diferente, ocorrido no mesmo ano."},

 {q:"O que caracterizou a política de \"Apaziguamento\", adotada por Inglaterra e França na Conferência de Munique (1938)?",lvl:"AVANÇADA",
  o:["Aceitar a anexação alemã dos Sudetos na tentativa de evitar uma guerra maior","Declarar guerra imediatamente à Alemanha","Formar uma aliança militar direta com a União Soviética","Impor sanções econômicas severas contra a Alemanha","Invadir preventivamente o território austríaco"],c:0,
  fb:"O \"Apaziguamento\" foi a estratégia de ceder às exigências territoriais de Hitler (como os Sudetos) para tentar evitar um conflito maior — o que, na prática, apenas incentivou novas exigências alemãs. As outras opções descrevem reações mais duras, que não foram tomadas nesse momento."},

 {q:"O que estabelecia o Pacto Nazi-Soviético de Não Agressão, assinado em 1939?",
  o:["Hitler e Stalin concordaram em não se atacar e em invadir e dividir a Polônia entre si","Uma aliança militar permanente entre Alemanha e União Soviética contra os Aliados","Um acordo comercial entre Estados Unidos e União Soviética","A criação de uma fronteira neutra entre Alemanha e França","Um tratado que encerrou definitivamente as hostilidades na Europa"],c:0,
  fb:"O pacto previa que Alemanha e URSS não se atacariam e combinavam dividir a Polônia entre si — um acordo que seria rompido pela própria Alemanha em 1941. Não se tratava de uma aliança militar duradoura nem de um acordo comercial."},

 {q:"Por que a Guerra Civil Espanhola (1936-1939) é considerada um \"ensaio\" para a Segunda Guerra Mundial?",lvl:"AVANÇADA",
  o:["Porque Hitler e Mussolini apoiaram Franco e testaram armamentos e táticas que usariam depois na Segunda Guerra","Porque terminou com a criação da ONU","Porque envolveu diretamente os Estados Unidos desde o início","Porque foi o primeiro conflito da história com uso de armas nucleares","Porque uniu Espanha e Alemanha em um só país"],c:0,
  fb:"A Alemanha e a Itália usaram a Guerra Civil Espanhola para testar equipamentos militares e estratégias (como o bombardeio de Guernica), o que depois seria aplicado em maior escala na Segunda Guerra. As demais alternativas não têm relação com esse conflito."},

 {q:"Qual evento marca o início oficial da Segunda Guerra Mundial?",
  o:["A invasão da Polônia pela Alemanha, em 1º de setembro de 1939","O ataque japonês a Pearl Harbor","A invasão alemã da União Soviética","A queda da França em 1940","O bombardeio de Guernica, em 1937"],c:0,
  fb:"A invasão da Polônia em 1º de setembro de 1939 levou Inglaterra e França a declararem guerra à Alemanha, marcando o início oficial do conflito. Os demais eventos ocorreram depois, já com a guerra em curso (ou antes dela, no caso de Guernica)."},

 {q:"O que caracteriza a estratégia militar alemã conhecida como Blitzkrieg (\"guerra-relâmpago\")?",lvl:"AVANÇADA",
  o:["Ataques rápidos, em massa e de surpresa, combinando tanques e aviões","Uma guerra de trincheiras prolongada, como na Primeira Guerra Mundial","Bloqueios navais de longa duração sem avanço terrestre","Ataques exclusivamente aéreos, sem qualquer apoio de tropas terrestres","Negociações diplomáticas prévias a cada invasão"],c:0,
  fb:"A Blitzkrieg se baseava em velocidade e surpresa, unindo tanques e aviação para romper rapidamente as defesas inimigas — o oposto da guerra de trincheiras lenta da Primeira Guerra Mundial."},

 {q:"Como a França ficou dividida após sua derrota para a Alemanha em 1940?",
  o:["Entre o norte, sob administração alemã direta, e o sul, governado pela República de Vichy","Entre zonas controladas pela Itália e pela Espanha","Entre territórios controlados pela Inglaterra e pelos Estados Unidos","Não houve divisão: a França permaneceu totalmente unificada","Foi anexada por completo ao território alemão"],c:0,
  fb:"Após a derrota, a França foi dividida entre a zona de ocupação alemã direta no norte e a chamada República de Vichy, um governo colaboracionista no sul."},

 {q:"Qual foi o resultado da Batalha da Inglaterra, em 1940?",lvl:"AVANÇADA",
  o:["A RAF britânica resistiu aos bombardeios da Luftwaffe e impediu a invasão alemã, apesar de dezenas de milhares de civis mortos","A Alemanha conquistou totalmente o território britânico","A Inglaterra se rendeu e assinou um armistício com a Alemanha","Os Estados Unidos entraram imediatamente na guerra para socorrer a Inglaterra","A batalha terminou sem vencedores definidos"],c:0,
  fb:"A força aérea britânica (RAF) resistiu aos ataques da força aérea alemã (Luftwaffe), impedindo a invasão da ilha — mas ao custo de mais de 40 mil civis mortos nos bombardeios."},

 {q:"O que aconteceu em junho de 1941, abrindo uma nova frente de combate na guerra?",
  o:["Hitler rompeu o Pacto Nazi-Soviético e invadiu a União Soviética","O Japão invadiu oficialmente a China","Os Estados Unidos declararam guerra à Alemanha","A Itália invadiu a Grécia pela primeira vez","A Inglaterra desembarcou tropas na Normandia"],c:0,
  fb:"Em junho de 1941, Hitler rompeu o acordo de não agressão com Stalin e invadiu a União Soviética, que reagiu de forma lenta por estar despreparada — abrindo uma nova e decisiva frente de guerra."},

 {q:"Qual foi a consequência imediata do ataque japonês a Pearl Harbor, em dezembro de 1941?",lvl:"AVANÇADA",
  o:["Os Estados Unidos entraram oficialmente na Segunda Guerra Mundial ao lado dos Aliados","O Japão se rendeu logo em seguida ao ataque","A Alemanha declarou guerra ao próprio Japão","A União Soviética se retirou completamente do conflito","A Inglaterra assinou um tratado de paz com o Japão"],c:0,
  fb:"O ataque-surpresa a Pearl Harbor, sem declaração prévia de guerra, levou os Estados Unidos a entrarem oficialmente no conflito ao lado dos Aliados — um reforço decisivo, já que seu parque industrial estava intacto."},

 {q:"Qual foi a participação do Brasil na Segunda Guerra Mundial?",
  o:["Após navios brasileiros serem torpedeados por submarinos alemães, o Brasil declarou guerra ao Eixo e enviou a FEB para combater na Europa em 1944","O Brasil permaneceu neutro durante todo o conflito","O Brasil enviou tropas apenas para lutar no Oceano Pacífico","O Brasil se manteve aliado ao Eixo até o fim da guerra","O Brasil participou apenas financeiramente, sem enviar nenhum soldado"],c:0,
  fb:"Depois de navios mercantes brasileiros serem torpedeados por submarinos alemães em 1943, o Brasil declarou guerra ao Eixo e, em 1944, enviou a Força Expedicionária Brasileira (FEB) para combater ao lado dos Aliados na Europa."},

 {q:"Por que a Batalha de Stalingrado (1943) é considerada um dos momentos mais decisivos da guerra, apesar de receber menos destaque do que o Dia D?",lvl:"AVANÇADA",
  o:["Porque marcou uma vitória soviética decisiva sobre os alemães, mas o cinema ocidental deu mais atenção ao Dia D por ter sido uma vitória dos Aliados ocidentais","Porque foi a única batalha travada inteiramente em território africano","Porque envolveu exclusivamente forças navais dos dois lados","Porque terminou em uma rendição soviética completa","Porque não teve nenhuma relação com o desfecho final da guerra"],c:0,
  fb:"Stalingrado foi um ponto de virada fundamental, com o Exército soviético vencendo os alemães e iniciando um avanço que libertaria vários países do Leste Europeu — mas, por ter sido uma vitória soviética, recebeu menos destaque no cinema ocidental do que o Dia D."},

 {q:"O que foi o Dia D, ocorrido em 6 de junho de 1944?",
  o:["O desembarque aliado na região da Normandia, na França, também chamado de Operação Overlord","A rendição oficial da Alemanha","O lançamento da bomba atômica sobre Hiroshima","A invasão da União Soviética pela Alemanha","A libertação de Paris pelas tropas soviéticas"],c:0,
  fb:"O Dia D foi o desembarque aliado na Normandia (Operação Overlord), um marco importante na retomada da Europa ocupada — embora a Batalha de Stalingrado tenha sido igualmente ou mais decisiva para o desfecho da guerra."},

 {q:"O que aconteceu com a liderança do Eixo entre abril e maio de 1945?",lvl:"AVANÇADA",
  o:["Mussolini foi morto por guerrilheiros da resistência italiana, Hitler se suicidou e a Alemanha assinou sua rendição","A Alemanha lançou uma ofensiva final vitoriosa contra os Aliados","Hitler fugiu com sucesso para a América do Sul","A Alemanha se aliou aos Aliados contra o Japão","A guerra na Europa se estendeu até 1946"],c:0,
  fb:"Em abril de 1945, Mussolini foi morto pela resistência italiana e, no fim do mesmo mês, Hitler se suicidou; em maio, a Alemanha assinou sua rendição, restando apenas a frente do Sudeste Asiático contra o Japão."},

 {q:"O que aconteceu em 6 e 9 de agosto de 1945?",
  o:["Os Estados Unidos lançaram bombas atômicas sobre Hiroshima e Nagasaki, respectivamente","O Japão se rendeu formalmente aos Aliados","A Alemanha assinou o armistício encerrando a guerra na Europa","A Organização das Nações Unidas foi oficialmente criada","A União Soviética invadiu o território japonês por mar"],c:0,
  fb:"Em 6 de agosto de 1945 os EUA lançaram a primeira bomba atômica sobre Hiroshima, e três dias depois, em 9 de agosto, uma segunda bomba atingiu Nagasaki — o Japão se renderia poucos dias depois, em 19 de agosto."},

 {q:"Quais foram as principais consequências da Segunda Guerra Mundial?",lvl:"AVANÇADA",
  o:["Cerca de 40 milhões de mortos (incluindo o Holocausto), o temor da destruição nuclear e o início da Guerra Fria entre EUA e URSS","O fim definitivo de todos os conflitos armados no mundo","A unificação política de toda a Europa em um único país","O desaparecimento completo das fronteiras nacionais","A criação de uma moeda única para todo o mundo"],c:0,
  fb:"A guerra deixou cerca de 40 milhões de mortos, incluindo os 6 milhões de vítimas do Holocausto, além de espalhar o medo da destruição nuclear e dar início à Guerra Fria entre Estados Unidos e União Soviética."},

 {q:"Qual era o principal objetivo da criação da ONU, em 1945?",
  o:["Promover a paz mundial, a cooperação internacional e a proteção dos direitos humanos","Estabelecer um único governo mundial centralizado","Garantir exclusivamente a vitória militar dos países Aliados","Criar um exército internacional permanente e unificado","Unificar as moedas de todos os países membros"],c:0,
  fb:"A ONU foi criada, com a participação de 50 países (incluindo o Brasil), para promover a paz mundial, a cooperação entre nações e a proteção dos direitos humanos, especialmente após os horrores revelados no fim da guerra."},

 {q:"Por que o Conselho de Segurança da ONU é frequentemente criticado por sua falta de eficácia em mediar conflitos atuais?",lvl:"AVANÇADA",
  o:["Porque seus 5 membros permanentes (EUA, Rússia, China, Reino Unido e França) têm poder de veto, o que dificulta o consenso","Porque o Conselho de Segurança não possui nenhum membro permanente","Porque suas decisões são sempre unânimes e demoram décadas para serem tomadas","Porque o órgão não tem qualquer relação com conflitos militares","Porque o Conselho de Segurança foi extinto ao final da Guerra Fria"],c:0,
  fb:"O poder de veto dos 5 membros permanentes do Conselho de Segurança permite que qualquer um deles bloqueie uma resolução, o que dificulta respostas rápidas e eficazes — algo visto hoje em conflitos como a invasão da Ucrânia e a questão Israel-Palestina."}
];

let idx=0, score=0, streak=0, bestStreak=0, answered=false;
const cardArea=document.getElementById('cardArea');
const pfill=document.getElementById('pfill');
const counter=document.getElementById('counter');
const streakEl=document.getElementById('streak');
const streakN=document.getElementById('streakn');
document.getElementById('intro').textContent=`${QUESTIONS.length} questões • escolha a alternativa correta e veja a explicação`;

function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function render(){
  answered=false;
  const item=QUESTIONS[idx];
  counter.textContent=`Questão ${idx+1} de ${QUESTIONS.length}`;
  pfill.style.width=`${(idx/QUESTIONS.length)*100}%`;
  const letters=['A','B','C','D','E'];
  const order=shuffled(item.o.map((_,i)=>i));
  const opts=order.map((orig,pos)=>`
    <button class="opt" data-i="${orig}" onclick="choose(${orig})">
      <span class="letter">${letters[pos]}</span>
      <span class="otext">${item.o[orig]}</span>
      <span class="mark"></span>
    </button>`).join('');
  cardArea.innerHTML=`
    <div class="card">
      <div class="qnum">Questão ${idx+1}${item.lvl?` <span class="lvl">🔴 ${item.lvl}</span>`:''}</div>
      <div class="qtext">${item.q}</div>
      <div id="opts">${opts}</div>
      <div class="fb" id="fb"></div>
      <button class="next" id="next" onclick="nextQ()">${idx===QUESTIONS.length-1?'Ver resultado 🏁':'Próxima →'}</button>
    </div>`;
}

function choose(i){
  if(answered) return; answered=true;
  const item=QUESTIONS[idx];
  document.querySelectorAll('.opt').forEach(b=>{
    const bi=+b.dataset.i; b.disabled=true;
    if(bi===item.c){ b.classList.add('correct'); b.querySelector('.mark').textContent='✅'; }
    if(bi===i && i!==item.c){ b.classList.add('wrong'); b.querySelector('.mark').textContent='❌'; }
  });
  const fb=document.getElementById('fb');
  if(i===item.c){
    score++; streak++; bestStreak=Math.max(bestStreak,streak);
    fb.className='fb ok show'; fb.innerHTML=`<div class="fbtitle">✅ Acertou!</div>${item.fb}`;
  } else {
    streak=0;
    fb.className='fb no show'; fb.innerHTML=`<div class="fbtitle">❌ Não foi dessa vez</div>${item.fb}`;
  }
  updateStreak();
  document.getElementById('next').classList.add('show');
}

function updateStreak(){
  if(streak>=2){ streakN.textContent=streak; streakEl.classList.add('show');
    streakEl.classList.remove('pop'); void streakEl.offsetWidth; streakEl.classList.add('pop'); }
  else streakEl.classList.remove('show');
}

function nextQ(){ idx++; if(idx>=QUESTIONS.length) showFinal(); else { render(); window.scrollTo({top:0,behavior:'smooth'}); } }

function showFinal(){
  pfill.style.width='100%'; counter.textContent='Concluído!'; streakEl.classList.remove('show');
  document.getElementById('quiz').classList.add('hidden');
  const fs=document.getElementById('finalScreen'); fs.classList.remove('hidden');
  const pct=Math.round((score/QUESTIONS.length)*100);
  let medal,msg;
  if(pct===100){medal='🏆';msg='Perfeito! Você dominou o capítulo!';}
  else if(pct>=80){medal='🥇';msg='Excelente! Você manda muito bem.';}
  else if(pct>=60){medal='🥈';msg='Bom trabalho! Já está afiado.';}
  else if(pct>=40){medal='🥉';msg='Tá no caminho — revise e tente de novo!';}
  else {medal='📚';msg='Bora revisar o resumo e voltar mais forte!';}
  fs.innerHTML=`
    <div class="medal">${medal}</div>
    <h2>${msg}</h2>
    <div class="pct">${pct}%</div>
    <div class="score">Você acertou ${score} de ${QUESTIONS.length} questões</div>
    <div class="stats">
      <div class="stat"><div class="big">${score}/${QUESTIONS.length}</div><div class="lbl">Acertos</div></div>
      <div class="stat"><div class="big">🔥 ${bestStreak}</div><div class="lbl">Maior sequência</div></div>
      <div class="stat"><div class="big">${pct}%</div><div class="lbl">Aproveitamento</div></div>
    </div>
    <button class="restart" onclick="restart()">🔄 Refazer o quiz</button>`;
  window.scrollTo({top:0,behavior:'smooth'});
  if(pct>=70) confetti();
}

function restart(){
  idx=0; score=0; streak=0; bestStreak=0;
  document.getElementById('finalScreen').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  render(); window.scrollTo({top:0,behavior:'smooth'});
}

function confetti(){
  const colors=['#3B82F6','#7C5CFF','#00A86B','#FF8A3D','#E53935','#FFD93D'];
  for(let i=0;i<120;i++){
    const c=document.createElement('div'); c.className='confetti';
    c.style.left=Math.random()*100+'vw'; c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.transform=`rotate(${Math.random()*360}deg)`;
    const dur=2.5+Math.random()*2, delay=Math.random()*1.5;
    c.style.animation=`fall ${dur}s ${delay}s linear forwards`;
    document.body.appendChild(c); setTimeout(()=>c.remove(),(dur+delay)*1000+200);
  }
}
const _s=document.createElement('style');
_s.textContent=`@keyframes fall{to{transform:translateY(105vh) rotate(720deg); opacity:.2;}}`;
document.head.appendChild(_s);

render();
</script>
</body>
</html>
